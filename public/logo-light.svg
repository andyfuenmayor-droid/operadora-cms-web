<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <!-- Gradient for Crisp Emerald M -->
    <linearGradient id="neonMGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="crispShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Stylized M Icon -->
  <g transform="translate(6, 6)" filter="url(#crispShadow)">
    <path d="M8 40V18C8 11.5 13.5 6 20 6C25.5 6 30 10 32 15C34 10 38.5 6 44 6C50.5 6 56 11.5 56 18V40" 
          stroke="url(#neonMGradientLight)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>

  <!-- Typography: Multibanca Express (High contrast for light mode) -->
  <text x="76" y="27" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="21" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">Multibanca</text>
  <text x="76" y="47" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="19" font-weight="800" fill="#059669" letter-spacing="-0.01em">Express</text>
</svg>
