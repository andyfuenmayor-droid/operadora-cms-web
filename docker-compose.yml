services:
  # ==============================================================================
  # 1. Base de Datos PostgreSQL 17 Alpine
  # ==============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: operadora-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-operadora_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Exponer solo en loopback local del Droplet para máxima seguridad
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_network

  # ==============================================================================
  # 2. Motor PostgREST Nativo (Backend REST /rest/v1 para las 4 Aplicaciones)
  # ==============================================================================
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: operadora-postgrest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql://${POSTGRES_USER:-admin_db}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-operadora_production}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-admin_db}
      PGRST_DB_MAX_ROWS: 5000
      PGRST_SERVER_PORT: 3000
    ports:
      - "127.0.0.1:8532:3000"
    networks:
      - internal_network

  # ==============================================================================
  # 3. Servidor Backend & Web Service API (Node.js con pool nativo pg)
  # ==============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: operadora-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8531}
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin_db}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-operadora_production}
      POSTGRES_USER: ${POSTGRES_USER:-admin_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-operadora_production}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGREST_URL: http://postgrest:3000
      PAYMENTS_API_KEY: ${PAYMENTS_API_KEY:-mbe_live_7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c}
    ports:
      - "127.0.0.1:${PORT:-8531}:${PORT:-8531}"
    networks:
      - internal_network

  # ==============================================================================
  # 4. Aplicación Web Frontend (React + Vite servida por Nginx)
  # ==============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: operadora-cms-web
    restart: always
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:8530:80"
    networks:
      - internal_network

volumes:
  pgdata:
    driver: local

networks:
  internal_network:
    driver: bridge
